<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>goloom</title>
    <link href="/main.css" rel="stylesheet"/>
</head>
<body>
<header class="header">
    <svg class="logo" viewBox="0 0 64 32" width="48" height="24">
        <g transform="translate(32 16)">
            <g class="eye">
                <path d="M -28 0 Q -14 -16 0 -16 Q 14 -16 28 0 Q 14 16 0 16 Q -14 16 -28 0 Z"
                      fill="#0e1014" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <circle r="9" fill="#0e1014" stroke="currentColor" stroke-width="1.5"/>
                <circle r="4" fill="currentColor"/>
                <circle cx="-2.5" cy="-2.5" r="1" fill="#fff" opacity="0.85"/>
            </g>
        </g>
    </svg>
    <h1>goloom</h1>
    <span class="badge">client</span>
    <div class="grow"></div>
    <span id="phase-chip" class="chip chip-idle">idle</span>
</header>

<main>
    <section class="card">
        <h2>Подключение</h2>
        <div id="profile-empty" class="muted-block" hidden>
            Нет сохранённых профилей. <button id="btn-add-empty" class="btn-link">Добавить профиль</button>
        </div>
        <div id="profile-controls" class="row" hidden>
            <select id="profile-select" class="field-select" title="Профиль"></select>
            <button id="btn-add"    class="btn btn-ghost btn-icon" title="Новый профиль">＋</button>
            <button id="btn-edit"   class="btn btn-ghost btn-icon" title="Редактировать профиль">✎</button>
            <button id="btn-delete" class="btn btn-ghost btn-icon" title="Удалить профиль">🗑</button>
        </div>
        <div class="row">
            <button id="btn-connect" class="btn btn-primary">Connect</button>
            <button id="btn-disconnect" class="btn btn-ghost" disabled>Disconnect</button>
            <span id="error" class="err"></span>
        </div>
    </section>

    <section class="card status-card">
        <h2>Статус</h2>
        <dl class="kv">
            <dt>Profile</dt><dd id="s-profile">—</dd>
            <dt>Transport</dt><dd id="s-transport">—</dd>
            <dt>Meeting</dt><dd id="s-meeting" class="mono">—</dd>
            <dt>Local UDP</dt><dd id="s-local" class="mono">—</dd>
            <dt>Peer</dt><dd id="s-peer" class="mono">—</dd>
            <dt>↑ TX</dt><dd id="s-tx" class="mono">0 / 0 B</dd>
            <dt>↓ RX</dt><dd id="s-rx" class="mono">0 / 0 B</dd>
            <dt>Last error</dt><dd id="s-err" class="mono err">—</dd>
        </dl>
    </section>

    <section class="card log-card">
        <div class="log-head">
            <h2>Лог</h2>
            <div class="log-tools">
                <label class="toggle">
                    <input type="checkbox" id="chk-trace"/>
                    <span>trace</span>
                </label>
                <button id="btn-clear-log" class="btn btn-ghost btn-xs">Очистить</button>
            </div>
        </div>
        <div id="log" class="log log-hide-trace"></div>
    </section>
</main>

<!-- ─── Profile modal ─────────────────────────────────────────── -->
<dialog id="profile-dialog" class="modal">
    <form method="dialog" id="profile-form" class="modal-body">
        <h3 id="profile-dialog-title">Новый профиль</h3>

        <label class="field-label" for="pf-name">Имя</label>
        <input id="pf-name" class="field" type="text" autocomplete="off" placeholder="например, Goloom — рабочий"/>

        <div class="tabs">
            <button type="button" class="tab tab-active" data-tab="connstr">Connstr</button>
            <button type="button" class="tab" data-tab="manual">Вручную</button>
        </div>

        <div class="tab-pane" data-pane="connstr">
            <label class="field-label" for="pf-connstr">Connection string из админки</label>
            <textarea id="pf-connstr" class="field" rows="3" autocomplete="off"
                      placeholder="goloom://eyJ..."></textarea>
        </div>

        <div class="tab-pane" data-pane="manual" hidden>
            <label class="field-label" for="pf-transport">Транспорт</label>
            <select id="pf-transport" class="field-select">
                <option value="telemost">Telemost</option>
                <option value="livekit-wb-stream">WB Stream (LiveKit)</option>
            </select>

            <div class="manual-fields" data-for="telemost">
                <label class="field-label" for="pf-meeting">Meeting URL</label>
                <input id="pf-meeting" class="field" type="text" autocomplete="off"
                       placeholder="https://telemost.yandex.ru/j/..."/>
            </div>

            <div class="manual-fields" data-for="livekit-wb-stream" hidden>
                <label class="field-label" for="pf-lk-room">Room URL</label>
                <input id="pf-lk-room" class="field" type="text" autocomplete="off"
                       placeholder="https://stream.wb.ru/room/..."/>
                <label class="field-label" for="pf-lk-token">Access token</label>
                <input id="pf-lk-token" class="field" type="text" autocomplete="off"/>
                <label class="field-label" for="pf-lk-cookies">Cookies</label>
                <input id="pf-lk-cookies" class="field" type="text" autocomplete="off"
                       placeholder="_wbafp=...; x_wbaas_token=..."/>
            </div>

            <label class="field-label" for="pf-listen">Local UDP listen (optional)</label>
            <input id="pf-listen" class="field" type="text" autocomplete="off"
                   placeholder="127.0.0.1:51820"/>
        </div>

        <span id="profile-dialog-error" class="err"></span>
        <div class="row modal-actions">
            <button id="btn-profile-save" class="btn btn-primary" type="button">Сохранить</button>
            <button class="btn btn-ghost" type="button" data-close-dialog>Отмена</button>
        </div>
    </form>
</dialog>

<!-- ─── Confirm-delete modal ─────────────────────────────────── -->
<dialog id="confirm-dialog" class="modal">
    <form method="dialog" class="modal-body">
        <h3>Удалить профиль?</h3>
        <p id="confirm-text" class="muted-block">…</p>
        <div class="row modal-actions">
            <button id="btn-confirm-yes" class="btn btn-danger" type="button">Удалить</button>
            <button class="btn btn-ghost" type="button" data-close-dialog>Отмена</button>
        </div>
    </form>
</dialog>

<script src="/main.js" type="module"></script>
</body>
</html>
